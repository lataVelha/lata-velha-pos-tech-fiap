spring:
  application:
    name: Lata-Velha
  profiles:
    active: ${ENVIRONMENT:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lata_velha}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration,classpath:db/migration-postgresql

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

jwt:
  public:
    key: classpath:app.pub
  private:
    key: classpath:app.key
    jwt:
  issuer: ${JWT_ISSUER:lata-velha}
  expires-in: ${JWT_EXPIRES_IN:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs

thymeleaf:
  prefix: classpath:/templates/
  suffix: .html
  mode: HTML
  encoding: UTF-8

otel:
  service:
    name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  resource:
    attributes:
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT_NAME:local}
      service.version: ${SERVICE_VERSION:0.0.1}
  exporter:
    otlp:
      enabled: ${OTEL_EXPORTER_OTLP_ENABLED:true}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:https://otlp.us5.datadoghq.com}
      traces:
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:https://otlp.us5.datadoghq.com/v1/traces}
      metrics:
        endpoint: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:https://otlp.us5.datadoghq.com/v1/metrics}
        temporality-preference: ${OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE:delta}
      logs:
        endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:https://otlp.us5.datadoghq.com/v1/logs}
      headers:
        dd-api-key: ${DD_API_KEY:}
        dd-otel-span-mapping: '{"span_name_as_resource_name": true}'
        dd-otel-metric-config: '{"resource_attributes_as_tags": true}'
  instrumentation:
    logback-appender:
      enabled: true
      experimental:
        capture-mdc-attributes: '*'
