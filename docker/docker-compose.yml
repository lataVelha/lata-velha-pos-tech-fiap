version: "3.8"

services:
  app:
    container_name: lata-velha
    hostname: lata-velha
    build: "../"
    environment:
      - ENVIRONMENT=docker
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    networks:
      - app_network

  postgres:
    image: postgres:15
    container_name: postgres-lata-velha
    environment:
      POSTGRES_DB: lata_velha
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
      - db_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app_network:
  db_network:
