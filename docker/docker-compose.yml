version: "3.8"

services:

  app:
    container_name: lata-velha
    hostname: lata-velha
    build: "../"
    restart: always
    environment:
      - ENVIRONMENT=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/lata_velha
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_FLYWAY_ENABLED=true
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    networks:
      - app_network

  postgres:
    image: postgres:15
    container_name: postgres-lata-velha
    restart: always
    environment:
      POSTGRES_DB: lata_velha
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
      - db_network

  sonarqube-db:
    image: postgres:13
    container_name: sonarqube-db
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_postgres:/var/lib/postgresql
      - sonarqube_postgres_data:/var/lib/postgresql/data
    networks:
      - db_network

  sonarqube:
    image: sonarqube:community
    container_name: lata-velha-sonar
    depends_on:
      - sonarqube-db
    restart: always
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - db_network
      - app_network

volumes:
  postgres_data:
  pgadmin_data:
  sonarqube_postgres:
  sonarqube_postgres_data:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  app_network:
  db_network: