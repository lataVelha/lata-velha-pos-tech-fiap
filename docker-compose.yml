services:
  app:
    container_name: lata-velha
    build: "."
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lata_velha
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: "587"
      SPRING_MAIL_USERNAME: lata.velha.fiap@gmail.com
      SPRING_MAIL_PASSWORD: suxj nonb utdn dokg
      JWT_ISSUER: lata-velha
      JWT_EXPIRES_IN: "3600"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - app_network

  postgres:
    image: postgres:15
    container_name: postgres-lata-velha
    restart: unless-stopped
    environment:
      POSTGRES_DB: lata_velha
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lata_velha"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
