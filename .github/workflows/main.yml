name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Força actions JS a rodarem no Node 24 (algumas ainda pedem Node 20)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================================
  # CI · TESTES
  # Compila o projeto e roda toda a suíte de testes (profile "test").
  # Executa em todo push e em todo PR para master. Falhando aqui,
  # o restante do pipeline é abortado.
  # ============================================================
  test:
    name: "CI · Testes automatizados"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: corretto
          cache: maven

      - name: Compilar e executar testes
        run: mvn -B test -Dspring.profiles.active=test

  # ============================================================
  # CD · PROVISIONAR INFRAESTRUTURA
  # Garante VPC, EKS, RDS e ECR na AWS (recursos de base, sem
  # depender do cluster já estar no ar). Exige os testes verdes e
  # só roda em push para master (nunca em PR).
  # ============================================================
  tf-bootstrap:
    name: "CD · Provisionar infraestrutura · VPC + EKS + RDS + ECR"
    needs: test
    # Só provisiona em push para master; em PR todo o CD é pulado.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    outputs:
      ecr_url: ${{ steps.outputs.outputs.ecr_url }}
      cluster_endpoint: ${{ steps.outputs.outputs.cluster_endpoint }}
      cluster_ca_data: ${{ steps.outputs.outputs.cluster_ca_data }}
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
      state_bucket: ${{ steps.outputs.outputs.state_bucket }}

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Provisionar bucket de estado (S3)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lata-velha-tfstate-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${BUCKET}" >> $GITHUB_ENV
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3 mb "s3://$BUCKET" --region ${{ vars.AWS_REGION }}
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi

      - name: Terraform Init — bootstrap
        run: |
          terraform -chdir=bootstrap init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}

      - name: Terraform Apply — bootstrap (VPC, EKS, RDS, ECR)
        run: terraform -chdir=bootstrap apply -auto-approve
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}

      - name: Exportar outputs do bootstrap
        id: outputs
        run: |
          echo "ecr_url=$(terraform -chdir=bootstrap output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "cluster_endpoint=$(terraform -chdir=bootstrap output -raw cluster_endpoint)" >> $GITHUB_OUTPUT
          echo "cluster_ca_data=$(terraform -chdir=bootstrap output -raw cluster_certificate_authority_data)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(terraform -chdir=bootstrap output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "state_bucket=${STATE_BUCKET}" >> $GITHUB_OUTPUT

  # ============================================================
  # CD · BUILD DA IMAGEM
  # Builda a imagem Docker e publica no ECR com a tag = SHA do commit
  # (imutável, usada pelo deploy). Usa cache de layers para acelerar.
  # ============================================================
  build:
    name: "CD · Build & push da imagem → ECR"
    needs: tf-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Autenticar no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir tag da imagem
        id: meta
        run: echo "image=${{ needs.tf-bootstrap.outputs.ecr_url }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build e push da imagem (ECR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          # Cache de layers entre runs (reaproveita o download de deps Maven)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # CD · DEPLOY DA APLICAÇÃO
  # Aplica ALB + app + cluster-autoscaler, usando os outputs do
  # bootstrap para configurar os providers kubectl e helm.
  # ============================================================
  tf-deploy:
    name: "CD · Deploy na aplicação · ALB + App + Autoscaler"
    needs: [build, tf-bootstrap]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Serializa deploys: não roda dois apply em paralelo
    concurrency:
      group: deploy
      cancel-in-progress: false

    outputs:
      app_url: ${{ steps.outputs.outputs.app_url }}

    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_docker_image: ${{ needs.build.outputs.image }}
      TF_VAR_mail_username: ${{ secrets.TF_MAIL_USERNAME }}
      TF_VAR_mail_password: ${{ secrets.TF_MAIL_PASSWORD }}
      TF_VAR_state_bucket: ${{ needs.tf-bootstrap.outputs.state_bucket }}
      TF_VAR_cluster_endpoint: ${{ needs.tf-bootstrap.outputs.cluster_endpoint }}
      TF_VAR_cluster_ca_data: ${{ needs.tf-bootstrap.outputs.cluster_ca_data }}
      TF_VAR_cluster_name: ${{ needs.tf-bootstrap.outputs.cluster_name }}
      TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Terraform Init — deploy
        run: |
          terraform -chdir=deploy init -reconfigure \
            -backend-config="bucket=${{ needs.tf-bootstrap.outputs.state_bucket }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Apply — deploy (ALB, app, autoscaler)
        run: terraform -chdir=deploy apply -auto-approve

      - name: Exportar URL da aplicação
        id: outputs
        run: echo "app_url=$(terraform -chdir=deploy output -raw app_url)" >> $GITHUB_OUTPUT

  # ============================================================
  # CD · VERIFICAÇÃO DO DEPLOY
  # Espera o rollout concluir (até 5 min) e faz um smoke test no
  # /actuator/health. Se um pod travar ou a aplicação não responder
  # 200, este job falha e sinaliza o deploy como quebrado.
  # ============================================================
  verify:
    name: "CD · Verificação do deploy"
    needs: [tf-deploy, tf-bootstrap]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar kubeconfig do cluster EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name ${{ needs.tf-bootstrap.outputs.cluster_name }}

      - name: Aguardar rollout do deployment
        run: |
          kubectl rollout status deployment/lata-velha-api \
            -n lata-velha \
            --timeout=5m

      - name: Smoke test — health check HTTP
        run: |
          URL="${{ needs.tf-deploy.outputs.app_url }}/actuator/health"
          echo "Testando $URL ..."
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK — status $STATUS"
              exit 0
            fi
            echo "Tentativa $i/10: status $STATUS — aguardando 15s..."
            sleep 15
          done
          echo "ERRO: aplicação não respondeu com 200 após 10 tentativas"
          exit 1
