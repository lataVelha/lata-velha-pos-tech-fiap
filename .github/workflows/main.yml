name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ============================================================
  # ETAPA 1 — TESTES  (CI)
  # Compila o projeto e roda todos os testes automatizados.
  # Executa em todo push e em todo PR aberto para master.
  # Se falhar, as etapas seguintes não rodam.
  # ============================================================
  test:
    name: "CI · 1 · Testes"
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lata_velha
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: corretto
          cache: maven

      - name: Compilar e rodar testes
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lata_velha
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: admin123

  # ============================================================
  # ETAPA 2 — INFRAESTRUTURA BASE / FASE 1  (CD)
  # Garante que VPC, EKS, RDS e ECR existem na AWS.
  # Usa apply.sh --phase 1 que também cria o bucket S3 de estado
  # automaticamente. Se tudo já existir, não faz nada (idempotente).
  # Só executa em push direto para master (não em PRs).
  # ============================================================
  tf-infra:
    name: "CD · 2 · Infraestrutura (Fase 1)"
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-22.04

    outputs:
      ecr_url: ${{ steps.ecr_url.outputs.url }}

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Aplicar Fase 1 (VPC + EKS + RDS + ECR)
        run: ./apply.sh --auto --phase 1
        env:
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_docker_image: placeholder
          TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_mail_username: ${{ secrets.TF_MAIL_USERNAME }}
          TF_VAR_mail_password: ${{ secrets.TF_MAIL_PASSWORD }}

      - name: Capturar URL do ECR
        id: ecr_url
        run: echo "url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

  # ============================================================
  # ETAPA 3 — BUILD DA IMAGEM DOCKER  (CD)
  # Constrói a imagem Docker e envia para o ECR criado na etapa
  # anterior. A imagem recebe como tag o SHA do commit.
  # ============================================================
  build:
    name: "CD · 3 · Build Docker → ECR"
    needs: tf-infra
    runs-on: ubuntu-22.04

    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        id: push
        run: |
          IMAGE=${{ needs.tf-infra.outputs.ecr_url }}:${{ github.sha }}
          docker build --platform linux/amd64 -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ============================================================
  # ETAPA 4 — DEPLOY / FASE 2  (CD)
  # Aplica os manifests Kubernetes com a nova imagem.
  # O ALB já foi criado na Fase 1 via module.alb (Terraform).
  # Usa apply.sh --phase 2 que reaproveita o estado da Fase 1.
  # ============================================================
  tf-deploy:
    name: "CD · 4 · Deploy (Fase 2)"
    needs: build
    runs-on: ubuntu-22.04

    concurrency:
      group: deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Aplicar Fase 2 (aplicacao)
        run: ./apply.sh --auto --phase 2
        env:
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_docker_image: ${{ needs.build.outputs.image }}
          TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_mail_username: ${{ secrets.TF_MAIL_USERNAME }}
          TF_VAR_mail_password: ${{ secrets.TF_MAIL_PASSWORD }}
          TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}

  # ============================================================
  # ETAPA 5 — VERIFICAÇÃO DO DEPLOY  (CD)
  # Aguarda os pods subirem com a nova imagem e confirma que
  # o rollout foi concluído com sucesso dentro de 5 minutos.
  # Se algum pod travar ou crashar, essa etapa falha e alerta.
  # ============================================================
  verify:
    name: "CD · 5 · Verificar Deploy"
    needs: tf-deploy
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar acesso ao cluster
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name ${{ vars.EKS_CLUSTER_NAME }}

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/lata-velha-api \
            -n lata-velha \
            --timeout=5m
