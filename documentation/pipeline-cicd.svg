<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#607d8b"/>
    </marker>
    <style>
      .title { font-size: 25px; font-weight: 700; fill: #232f3e; }
      .sub   { font-size: 13px; fill: #5f6b7a; }
      .badge { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .job   { font-size: 16px; font-weight: 700; fill: #232f3e; }
      .tag   { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .needs { font-size: 11px; fill: #90a4ae; }
      .faz   { font-size: 13px; fill: #263238; }
      .por   { font-size: 13px; fill: #607d8b; }
      .k     { font-weight: 700; fill: #37474f; }
      .spine { stroke: #b0bec5; stroke-width: 2.4; fill: none; }
    </style>
  </defs>

  <rect width="960" height="1180" fill="#f4f6f9"/>
  <text x="40" y="46" class="title">CI/CD — Lata Velha · passo a passo</text>
  <text x="40" y="69" class="sub">Pipeline encadeado: cada job só roda se o anterior passar. O CD executa apenas em push para master.</text>

  <!-- Gatilho -->
  <rect x="300" y="92" width="360" height="50" rx="25" fill="#eceff1" stroke="#90a4ae"/>
  <text x="480" y="123" text-anchor="middle" class="faz"><tspan class="k">▶ Gatilho:</tspan>  push em master  ·  PR → master</text>

  <!-- Spine -->
  <path class="spine" d="M80 150 L80 950"/>
  <path class="spine" d="M80 232 L80 318" marker-end="url(#a)"/>
  <path class="spine" d="M80 372 L80 488" marker-end="url(#a)"/>
  <path class="spine" d="M80 552 L80 638" marker-end="url(#a)"/>
  <path class="spine" d="M80 702 L80 783" marker-end="url(#a)"/>
  <path class="spine" d="M80 847 L80 933" marker-end="url(#a)"/>

  <!-- ===== STEP 1 : test (CI) ===== -->
  <line x1="80" y1="200" x2="120" y2="200" class="spine"/>
  <circle cx="80" cy="200" r="21" fill="#1565c0"/>
  <text x="80" y="207" text-anchor="middle" class="badge">1</text>
  <rect x="120" y="172" width="800" height="116" rx="12" fill="#ffffff" stroke="#1565c0"/>
  <rect x="140" y="188" width="30" height="18" rx="9" fill="#1565c0"/>
  <text x="155" y="201" text-anchor="middle" class="tag">CI</text>
  <text x="182" y="203" class="job">test — Testes automatizados</text>
  <line x1="140" y1="218" x2="900" y2="218" stroke="#eceff1"/>
  <text x="140" y="245" class="faz"><tspan class="k">Faz:</tspan>  compila o projeto e roda toda a suíte de testes (mvn test).</text>
  <text x="140" y="271" class="por"><tspan class="k">Por quê:</tspan>  barreira inicial — código quebrado não vira infra nem deploy. Roda também nos PRs.</text>

  <!-- ===== STEP 2 : tf-bootstrap (CD) ===== -->
  <line x1="80" y1="345" x2="120" y2="345" class="spine"/>
  <circle cx="80" cy="345" r="21" fill="#ef6c00"/>
  <text x="80" y="352" text-anchor="middle" class="badge">2</text>
  <rect x="120" y="317" width="800" height="140" rx="12" fill="#ffffff" stroke="#ef6c00"/>
  <rect x="140" y="333" width="30" height="18" rx="9" fill="#ef6c00"/>
  <text x="155" y="346" text-anchor="middle" class="tag">CD</text>
  <text x="182" y="348" class="job">tf-bootstrap — Provisionar infraestrutura</text>
  <text x="900" y="346" text-anchor="end" class="needs">needs: test</text>
  <line x1="140" y1="363" x2="900" y2="363" stroke="#f3e6da"/>
  <text x="140" y="390" class="faz"><tspan class="k">Faz:</tspan>  garante o bucket S3 do estado e aplica VPC + EKS + RDS + ECR (Terraform).</text>
  <text x="140" y="416" class="por"><tspan class="k">Por quê:</tspan>  o build e o deploy precisam da infra base existir — ECR p/ a imagem, EKS p/ os</text>
  <text x="200" y="438" class="por">pods, RDS p/ os dados. Só roda em push para master, nunca em PR.</text>

  <!-- ===== STEP 3 : build (CD) ===== -->
  <line x1="80" y1="525" x2="120" y2="525" class="spine"/>
  <circle cx="80" cy="525" r="21" fill="#ef6c00"/>
  <text x="80" y="532" text-anchor="middle" class="badge">3</text>
  <rect x="120" y="497" width="800" height="116" rx="12" fill="#ffffff" stroke="#ef6c00"/>
  <rect x="140" y="513" width="30" height="18" rx="9" fill="#ef6c00"/>
  <text x="155" y="526" text-anchor="middle" class="tag">CD</text>
  <text x="182" y="528" class="job">build — Build &amp; push da imagem → ECR</text>
  <text x="900" y="526" text-anchor="end" class="needs">needs: tf-bootstrap</text>
  <line x1="140" y1="543" x2="900" y2="543" stroke="#f3e6da"/>
  <text x="140" y="570" class="faz"><tspan class="k">Faz:</tspan>  builda a imagem Docker e envia ao ECR com tag = SHA do commit (cache de layers).</text>
  <text x="140" y="596" class="por"><tspan class="k">Por quê:</tspan>  empacota a app numa imagem imutável e rastreável ao commit, pronta p/ o cluster.</text>

  <!-- ===== STEP 4 : tf-deploy (CD) ===== -->
  <line x1="80" y1="675" x2="120" y2="675" class="spine"/>
  <circle cx="80" cy="675" r="21" fill="#ef6c00"/>
  <text x="80" y="682" text-anchor="middle" class="badge">4</text>
  <rect x="120" y="647" width="800" height="116" rx="12" fill="#ffffff" stroke="#ef6c00"/>
  <rect x="140" y="663" width="30" height="18" rx="9" fill="#ef6c00"/>
  <text x="155" y="676" text-anchor="middle" class="tag">CD</text>
  <text x="182" y="678" class="job">tf-deploy — Deploy na aplicação</text>
  <text x="900" y="676" text-anchor="end" class="needs">needs: build, tf-bootstrap</text>
  <line x1="140" y1="693" x2="900" y2="693" stroke="#f3e6da"/>
  <text x="140" y="720" class="faz"><tspan class="k">Faz:</tspan>  aplica ALB + app (k8s) + cluster-autoscaler, injetando a imagem recém-buildada.</text>
  <text x="140" y="746" class="por"><tspan class="k">Por quê:</tspan>  coloca a nova versão rodando no EKS e a expõe ao mundo via ALB.</text>

  <!-- ===== STEP 5 : verify (CD) ===== -->
  <line x1="80" y1="825" x2="120" y2="825" class="spine"/>
  <circle cx="80" cy="825" r="21" fill="#2e7d32"/>
  <text x="80" y="832" text-anchor="middle" class="badge">5</text>
  <rect x="120" y="797" width="800" height="116" rx="12" fill="#ffffff" stroke="#2e7d32"/>
  <rect x="140" y="813" width="30" height="18" rx="9" fill="#2e7d32"/>
  <text x="155" y="826" text-anchor="middle" class="tag">CD</text>
  <text x="182" y="828" class="job">verify — Verificação do deploy</text>
  <text x="900" y="826" text-anchor="end" class="needs">needs: tf-deploy</text>
  <line x1="140" y1="843" x2="900" y2="843" stroke="#e6f0e6"/>
  <text x="140" y="870" class="faz"><tspan class="k">Faz:</tspan>  espera o rollout dos pods (até 5 min) e faz smoke test em /actuator/health.</text>
  <text x="140" y="896" class="por"><tspan class="k">Por quê:</tspan>  confirma que subiu e responde 200 — se travar ou crashar, o job falha e alerta.</text>

  <!-- Final -->
  <circle cx="80" cy="950" r="14" fill="#2e7d32"/>
  <text x="80" y="956" text-anchor="middle" class="badge" font-size="15">✓</text>
  <text x="110" y="956" class="k" font-size="15" fill="#2e7d32">Deploy publicado e verificado</text>

  <!-- Nota PR -->
  <rect x="120" y="990" width="800" height="74" rx="12" fill="#eceff1" stroke="#b0bec5"/>
  <text x="140" y="1018" class="faz"><tspan class="k">Em um Pull Request (sem merge):</tspan>  roda apenas o passo 1 (testes).</text>
  <text x="140" y="1044" class="por">Os passos 2–5 (CD) são pulados — só executam em push para master, evitando deploy de PR não aprovado.</text>

  <!-- Legenda -->
  <rect x="120" y="1086" width="800" height="60" rx="12" fill="#ffffff" stroke="#cfd8dc"/>
  <rect x="140" y="1106" width="30" height="18" rx="9" fill="#1565c0"/>
  <text x="155" y="1119" text-anchor="middle" class="tag">CI</text>
  <text x="182" y="1121" class="por">Integração contínua — valida o código (push e PR)</text>
  <rect x="560" y="1106" width="30" height="18" rx="9" fill="#ef6c00"/>
  <text x="575" y="1119" text-anchor="middle" class="tag">CD</text>
  <text x="602" y="1121" class="por">Entrega contínua — provisiona e implanta (só em master)</text>
</svg>
